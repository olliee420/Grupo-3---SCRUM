<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Cocina de Cafetería</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #1e1e24;
            /* Fondo oscuro para descanso visual del personal */
            color: #f5f5f7;
            margin: 0;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2d2d35;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0;
            color: #e5a93c;
            font-size: 1.8rem;
        }

        .indicador-tiempo-real {
            background: #27ae60;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            animation: pulso 2s infinite;
        }

        @keyframes pulso {
            0% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.6;
            }
        }

        /* Contenedor de las dos columnas de trabajo */
        .tablero-cocina {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .tablero-cocina {
                grid-template-columns: 1fr 1fr;
            }
        }

        .columna {
            background: #2d2d35;
            padding: 15px;
            border-radius: 10px;
            min-height: 500px;
        }

        .columna-titulo {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 3px solid #444;
            display: flex;
            justify-content: space-between;
        }

        .contador-badge {
            background: #444;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.9rem;
        }

        /* Tarjetas de Pedidos Individuales */
        .tarjeta-pedido {
            background: #3e3e4a;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 6px solid #e5a93c;
            /* Naranja para nuevos */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .tarjeta-pedido.en-progreso {
            border-left-color: #2980b9;
            /* Azul para preparación */
        }

        .pedido-cabecera {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 8px;
        }

        .pedido-cliente {
            color: #ccc;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        /* Lista de productos solicitados */
        .pedido-productos {
            background: #2d2d35;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .producto-linea {
            font-size: 0.95rem;
            margin-bottom: 5px;
        }

        .producto-extras {
            font-size: 0.85rem;
            color: #aaa;
            padding-left: 15px;
            margin: 2px 0 6px 0;
        }

        /* Botones de acción (HU-06) */
        .btn-accion {
            background: #e5a93c;
            color: #1e1e24;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .btn-accion:hover {
            opacity: 0.9;
        }

        .btn-preparar {
            background-color: #2980b9;
            color: white;
        }

        .btn-terminar {
            background-color: #27ae60;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <h1>🍳 Panel de Órdenes de Cocina</h1>
        <div class="indicador-tiempo-real">● TIEMPO REAL ACTIVO</div>
    </header>

    <div class="tablero-cocina">

        <!-- COLUMNA 1: PEDIDOS NUEVOS (ORDENADOS POR LLEGADA) -->
        <div class="columna">
            <div class="columna-titulo">
                <span>📥 Nuevos Pedidos</span>
                <span class="contador-badge" id="cant-nuevos">0</span>
            </div>
            <div id="contenedor-nuevos">
                <!-- Tarjetas inyectadas por JS -->
            </div>
        </div>

        <!-- COLUMNA 2: EN PREPARACIÓN -->
        <div class="columna">
            <div class="columna-titulo">
                <span>🔥 En Preparación</span>
                <span class="contador-badge" id="cant-progreso">0</span>
            </div>
            <div id="contenedor-progreso">
                <!-- Tarjetas inyectadas por JS -->
            </div>
        </div>

    </div>

    <!-- ==========================================
       JAVASCRIPT: MANEJO DE COLUMNAS Y FLUJO
       ========================================== */ -->
    <script>
        // Memoria volátil que simula los datos de la base de datos
        let listaPedidos = [
            {
                id: 1,
                referencia: "#CAF-9812",
                cliente: "Carlos Gómez (Estudiante)",
                hora: "15:52",
                estado: "Nuevo",
                productos: "1x Café Americano (Grande), 1x Croissant de Jamón"
            },
            {
                id: 2,
                referencia: "#CAF-9813",
                cliente: "Elena Rostrán (Docente)",
                hora: "15:55",
                estado: "Nuevo",
                productos: "1x Capuccino (Leche de Almendras)"
            }
        ];

        // Función principal para redibujar el panel
        function renderizarTablero() {
            const contenedorNuevos = document.getElementById('contenedor-nuevos');
            const contenedorProgreso = document.getElementById('contenedor-progreso');

            // Limpiar tableros
            contenedorNuevos.innerHTML = '';
            contenedorProgreso.innerHTML = '';

            let nuevosContador = 0;
            let progresoContador = 0;

            // Procesar los pedidos. Al usar arreglos comunes, mantiene el orden de inserción nativo.
            listaPedidos.forEach(pedido => {

                if (pedido.estado === "Nuevo") {
                    nuevosContador++;
                    contenedorNuevos.innerHTML += `
            <div class="tarjeta-pedido">
              <div class="pedido-cabecera">
                <span>${pedido.referencia}</span>
                <span style="color: #e5a93c;">🕒 Recibido: ${pedido.hora}</span>
              </div>
              <div class="pedido-cliente">${pedido.cliente}</div>
              <div class="pedido-productos">
                <div class="producto-linea">${pedido.productos}</div>
              </div>
              <button class="btn-accion btn-preparar" onclick="cambiarEstado(${pedido.id}, 'En Preparacion')">
                👩‍🍳 Empezar Preparación
              </button>
            </div>
          `;
                }

                else if (pedido.estado === "En Preparacion") {
                    progresoContador++;
                    contenedorProgreso.innerHTML += `
            <div class="tarjeta-pedido en-progreso">
              <div class="pedido-cabecera">
                <span>${pedido.referencia}</span>
                <span style="color: #3498db;">👨‍🍳 En cocina</span>
              </div>
              <div class="pedido-cliente">${pedido.cliente}</div>
              <div class="pedido-productos">
                <div class="producto-linea">${pedido.productos}</div>
              </div>
              <button class="btn-accion btn-terminar" onclick="cambiarEstado(${pedido.id}, 'Listo')">
                ✅ Marcar como Listo
              </button>
            </div>
          `;
                }
            });

            // Actualizar los numeritos superiores de control
            document.getElementById('cant-nuevos').innerText = nuevosContador;
            document.getElementById('cant-progreso').innerText = progresoContador;
        }

        // Función intermedia para la HU-06 (Cambiar de estado)
        function cambiarEstado(id, nuevoEstado) {
            // Buscamos el pedido en nuestro arreglo y modificamos su propiedad estado
            const pedido = listaPedidos.find(p => p.id === id);
            if (pedido) {
                pedido.estado = nuevoEstado;

                // Si se marca listo, en producción se borraría del tablero de cocina 
                // y pasaría a la pantalla de despacho de la HU-06. Aquí solo lo quitamos.
                if (nuevoEstado === 'Listo') {
                    listaPedidos = listaPedidos.filter(p => p.id !== id);
                    alert(`El pedido ${pedido.referencia} fue marcado como LISTO. Se notificó al estudiante.`);
                }

                renderizarTablero();
            }
        }

        // SIMULADOR DE TIEMPO REAL (Agrega una orden ficticia cada 12 segundos)
        setInterval(() => {
            const nuevoId = Date.now();
            const horaActual = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            listaPedidos.push({
                id: nuevoId,
                referencia: `#CAF-${Math.floor(1000 + Math.random() * 9000)}`,
                cliente: "Usuario En Línea",
                hora: horaActual,
                estado: "Nuevo",
                productos: "1x Té Frío (Grande)"
            });

            renderizarTablero();
        }, 12000);

        // Arrancar el tablero por primera vez al cargar
        renderizarTablero();
    </script>
</body>

</html>
