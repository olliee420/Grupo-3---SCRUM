<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Notificaciones en Tiempo Real</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }

        .consola-cliente {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }

        h2 {
            color: #4a2c11;
            margin-top: 0;
        }

        .status-conexion {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            color: #27ae60;
            background: #e8f5e9;
            padding: 4px 12px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        /* 🔔 CONTENEDOR FLOTANTE PARA LAS NOTIFICACIONES (TOASTS) */
        #contenedor-toasts {
            position: fixed;
            bottom: 20px;
            left: 20px;
            /* Posicionado abajo a la izquierda para no estorbar el menú */
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 360px;
            width: 100%;
        }

        /* Estilo de la Alerta Flotante */
        .toast-notificacion {
            background: #1e293b;
            /* Fondo oscuro elegante */
            color: white;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast-notificacion.visible {
            transform: translateY(0);
            opacity: 1;
        }

        .toast-icono {
            font-size: 1.4rem;
        }

        .toast-contenido {
            flex: 1;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .toast-titulo {
            font-weight: bold;
            color: #e5a93c;
            margin-bottom: 2px;
        }

        /* Panel de control para pruebas en la parte inferior */
        .panel-simulacion {
            margin-top: 25px;
            border-top: 1px solid #e2e8f0;
            padding-top: 20px;
        }

        .btn-control {
            background: #4a2c11;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .btn-control:hover {
            background: #361f0b;
        }
    </style>
</head>

<body>

    <!-- INTERFAZ DEL ESTUDIANTE -->
    <div class="consola-cliente">
        <div class="status-conexion">● Conectado a la Cafetería</div>
        <h2>Mi Pedido en Línea</h2>
        <p style="color: #64748b; font-size: 0.95rem;">
            Puedes seguir navegando por la aplicación o cerrar tu pantalla. Te avisaremos de inmediato en esta esquina
            cuando tu orden cambie de estado.
        </p>

        <!-- SIMULADOR DE ACCIONES DE COCINA -->
        <div class="panel-simulacion">
            <p style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 10px;">PROBADOR DE HISTORIA DE USUARIO (Simula
                la Cocina):</p>
            <button class="btn-control" onclick="simularServidorEnviaCambio('En Preparacion')">⚙️ Simular: Cocina
                Inicia</button>
            <button class="btn-control" style="background:#27ae60;" onclick="simularServidorEnviaCambio('Listo')">🎉
                Simular: Orden Lista</button>
        </div>
    </div>

    <!-- CONTENEDOR DE ALERTAS -->
    <div id="contenedor-toasts"></div>

    <!-- ==========================================
       LÓGICA JAVASCRIPT DE TIEMPO REAL
       ========================================== */ -->
    <script>
        /**
         * Función que recibe la actualización del estado y construye la notificación.
         * En producción, esta función es activada remotamente por un evento de WebSocket.
         */
        function recibirNotificacionDeEstado(nuevoEstado, numeroReferencia) {
            const contenedor = document.getElementById('contenedor-toasts');

            // 1. Crear el elemento div de la alerta
            const nuevoToast = document.createElement('div');
            nuevoToast.className = 'toast-notificacion';
            nuevoToast.setAttribute('role', 'status');

            // 2. Definir textos e iconos según el estado enviado por la cocina
            let titulo = "";
            let mensaje = "";
            let icono = "";

            if (nuevoEstado === 'En Preparacion') {
                icono = "👩‍🍳";
                titulo = "¡Pedido en Cocina!";
                mensaje = `Tu orden ${numeroReferencia} ya se está preparando.`;
            } else if (nuevoEstado === 'Listo') {
                icono = "☕";
                titulo = "¡Pedido Listo para Retirar!";
                mensaje = `Tu orden ${numeroReferencia} está lista en la barra. ¡Pasa por ella!`;

                // Ejecutar un sonido corto de notificación de fondo para llamar la atención del estudiante
                reproducirAlertaSonora();
            }

            // 3. Montar la estructura interna
            nuevoToast.innerHTML = `
        <div class="toast-icono">${icono}</div>
        <div class="toast-contenido">
          <div class="toast-titulo">${titulo}</div>
          <div>${mensaje}</div>
        </div>
      `;

            // 4. Insertar la alerta al inicio del contenedor
            contenedor.appendChild(nuevoToast);

            // 5. Animación de Entrada
            setTimeout(() => {
                nuevoToast.classList.add('visible');
            }, 50);

            // 6. Remover la notificación automáticamente tras 5 segundos
            setTimeout(() => {
                nuevoToast.classList.remove('visible');
                setTimeout(() => nuevoToast.remove(), 400); // Esperar transicion CSS
            }, 5000);
        }

        // Función estética: Genera un pitido sutil usando la tarjeta de sonido nativa del navegador
        function reproducirAlertaSonora() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = "sine";
                osc.frequency.value = 587.33; // Nota Re5 (sonido amigable)
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch (e) {
                console.log("Audio Bloqueado por permisos del navegador hasta que interactúes con la página.");
            }
        }

        /* ==========================================================
           SIMULADOR DE BACKEND (WEB-PUSH / WEBSOCKET EVENT)
           ========================================================== */
        function simularServidorEnviaCambio(estadoSimulado) {
            // Pasamos los parámetros simulados a nuestra función receptora
            recibirNotificacionDeEstado(estadoSimulado, "#CAF-4815");
        }
    </script>
</body>

</html>
