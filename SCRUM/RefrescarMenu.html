<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Digital de la Cafetería</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 30px;
            color: #333;
        }

        .contenedor {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: #4a2c11;
            padding: 20px;
            border-radius: 12px;
            color: white;
        }

        h1 {
            margin: 0;
            font-size: 1.6rem;
        }

        .status-sincronizacion {
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .punto-parpado {
            width: 8px;
            height: 8px;
            background: #2ecc71;
            border-radius: 50%;
            animation: parpadear 1.5s infinite;
        }

        @keyframes parpadear {
            0% {
                opacity: 0.4;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.4;
            }
        }

        /* ☕ GRILLA DE PRODUCTOS */
        .menu-grilla {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .tarjeta-producto {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* Efecto sutil cuando un producto se actualiza en la lista */
        .tarjeta-producto.actualizado {
            animation: flash-actualizacion 1s ease;
        }

        @keyframes flash-actualizacion {
            0% {
                background-color: #fef08a;
                transform: scale(1.02);
            }

            100% {
                background-color: white;
                transform: scale(1);
            }
        }

        .producto-nombre {
            font-size: 1.2rem;
            font-weight: bold;
            color: #1e293b;
            margin: 0 0 8px 0;
        }

        .producto-descripcion {
            font-size: 0.9rem;
            color: #64748b;
            margin: 0 0 15px 0;
            line-height: 1.4;
            flex-grow: 1;
        }

        .producto-pie {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .producto-precio {
            font-size: 1.3rem;
            font-weight: 700;
            color: #27ae60;
        }

        .btn-pedir {
            background: #4a2c11;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Consola inferior para simular cambios de administración */
        .consola-admin {
            margin-top: 40px;
            background: #1e1e24;
            color: white;
            padding: 20px;
            border-radius: 10px;
        }

        .btn-admin {
            background: #e5a93c;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-right: 10px;
        }
    </style>
</head>

<body>

    <div class="contenedor">
        <header>
            <h1>☕ Menú Digital Activo</h1>
            <div class="status-sincronizacion">
                <div class="punto-parpado"></div>
                <span id="txt-sincro">Sincronizado con cocina</span>
            </div>
        </header>

        <!-- CONTENEDOR DONDE JAVASCRIPT MOSTRARÁ EL MENÚ ACTUALIZADO -->
        <div class="menu-grilla" id="contenedor-menu">
            <!-- Los productos se cargan y borran solos desde el script -->
        </div>

        <!-- CONSOLA DE PRUEBAS DE ADMINISTRACIÓN (HU-07) -->
        <div class="consola-admin">
            <h3>🛠️ Consola de Simulación (Administrador de Cafetería)</h3>
            <p>Simula que el administrador entra al sistema y cambia datos en la base de datos de MySQL:</p>
            <button class="btn-admin" onclick="simularCambioPrecio()">Modificar Precio del Capuccino</button>
            <button class="btn-admin" style="background:#27ae60; color:white;" onclick="simularNuevoProducto()">Agregar
                Producto Nuevo</button>
        </div>
    </div>

    <!-- ==========================================
       LÓGICA JAVASCRIPT AUTOMÁTICA
       ========================================== */ -->
    <script>
        // 1. Simulación de los productos iniciales que están en la base de datos MySQL
        let productosBD = [
            { id: 101, nombre: "Café Americano", descripcion: "Café expreso diluido en agua caliente.", precio: 1.50 },
            { id: 102, nombre: "Capuccino", descripcion: "Café expreso con leche espumosa y un toque de canela.", precio: 2.50 },
            { id: 103, nombre: "Croissant de Jamón", descripcion: "Croissant hojaldrado artesanal relleno de jamón seleccionado.", precio: 2.00 }
        ];

        // Guardamos una copia del estado anterior para saber si algo cambió y aplicar la animación flash
        let catalogoAnteriorJSON = "";

        /**
         * Función que dibuja los elementos en la interfaz pública
         */
        function renderizarMenuPublico() {
            const contenedor = document.getElementById('contenedor-menu');

            // Convertimos el catálogo actual a texto para compararlo fácilmente con el anterior
            const catalogoActualJSON = JSON.stringify(productosBD);
            const esPrimeraCarga = catalogoAnteriorJSON === "";
            const huboCambios = catalogoAnteriorJSON !== catalogoActualJSON;

            if (huboCambios || esPrimeraCarga) {
                contenedor.innerHTML = ''; // Limpiamos la pantalla

                productosBD.forEach(producto => {
                    // Detectamos si este producto específico cambió o es nuevo para animarlo
                    let claseActualizacion = "";
                    if (!esPrimeraCarga && !catalogoAnteriorJSON.includes(`"id":${producto.id},"nombre":"${producto.nombre}","descripcion":"${producto.descripcion}","precio":${producto.precio}`)) {
                        claseActualizacion = "actualizado";
                    }

                    contenedor.innerHTML += `
            <div class="tarjeta-producto ${claseActualizacion}">
              <div>
                <h3 class="producto-nombre">${producto.nombre}</h3>
                <p class="producto-descripcion">${producto.descripcion}</p>
              </div>
              <div class="producto-pie">
                <span class="producto-precio">$${producto.precio.toFixed(2)}</span>
                <button class="btn-pedir">Pedir 🛒</button>
              </div>
            </div>
          `;
                });

                // Guardamos el estado actual como el nuevo registro histórico
                catalogoAnteriorJSON = catalogoActualJSON;
            }
        }

        /**
         * 🔥 SINCRONIZADOR AUTOMÁTICO (Long Polling)
         * Monitorea la base de datos cada 4 segundos de forma transparente para el usuario
         */
        setInterval(() => {
            const etiquetaSincro = document.getElementById('txt-sincro');
            etiquetaSincro.innerText = "Buscando actualizaciones...";

            // Simula el retraso de la red (Fetch request a tu API backend)
            setTimeout(() => {
                renderizarMenuPublico();
                etiquetaSincro.innerText = "Menú actualizado en tiempo real";
            }, 600);

        }, 4000);


        /* ==========================================================
           FUNCIONES DEL SIMULADOR ADMINISTRATIVO (HU-07)
           ========================================================== */

        // Simula la edición de un producto existente
        function simularCambioPrecio() {
            const capuccino = productosBD.find(p => p.id === 102);
            if (capuccino) {
                capuccino.precio = 3.25; // Subió el precio en la BD
                alert("Administración cambió el precio del Capuccino a $3.25 en MySQL. Espera 4 segundos para ver el reflejo automático en el menú de arriba.");
            }
        }

        // Simula la inserción de una fila nueva en la tabla de productos
        function simularNuevoProducto() {
            const existe = productosBD.some(p => p.id === 104);
            if (!existe) {
                productosBD.push({
                    id: 104,
                    nombre: "Muffin de Chocolate",
                    descripcion: "Delicioso panqué esponjoso con chispas de chocolate semi-amargo.",
                    precio: 1.75
                });
                alert("Administración agregó 'Muffin de Chocolate' al catálogo. El menú público lo recibirá automáticamente en el siguiente ciclo.");
            }
        }

        // Carga inicial al abrir la página
        renderizarMenuPublico();
    </script>
</body>

</html>
