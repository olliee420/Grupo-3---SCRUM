<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Notificaciones - Cafetería</title>
    <style>
        /* ==========================================
       ESTILOS GENERALES DE LA PÁGINA
       ========================================== */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .panel-botones {
            display: flex;
            gap: 15px;
        }

        button {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-exito {
            background-color: #2e7d32;
            color: white;
        }

        .btn-exito:hover {
            background-color: #215c24;
        }

        .btn-error {
            background-color: #c62828;
            color: white;
        }

        .btn-error:hover {
            background-color: #9a1f1f;
        }


        /* ==========================================
       CONTENEDOR DE NOTIFICACIONES (FLOTANTE)
       ========================================== */
        #contenedor-notificaciones {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            /* Separación entre alertas */
            max-width: 400px;
            width: 100%;
        }


        /* ==========================================
       ESTILOS DE LAS ALERTAS (TARJETAS)
       ========================================== */
        .alerta {
            background-color: white;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: flex-start;
            gap: 12px;
            opacity: 0;
            transform: translateX(50px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        /* Clase que activa JavaScript para la animación de entrada */
        .alerta.mostrar {
            opacity: 1;
            transform: translateX(0);
        }

        /* Iconos y textos */
        .alerta-icono {
            font-size: 1.3rem;
            line-height: 1;
        }

        .alerta-contenido {
            flex: 1;
        }

        .alerta-titulo {
            font-weight: 700;
            margin-bottom: 4px;
            font-size: 0.95rem;
        }

        .alerta-mensaje {
            color: #555;
            font-size: 0.9rem;
            line-height: 1.4;
        }


        /* ==========================================
       VARIACIONES DE COLOR (ÉXITO Y ERROR)
       ========================================== */
        /* Variación de Éxito */
        .alerta-exito {
            border-left: 6px solid #4caf50;
        }

        .alerta-exito .alerta-titulo {
            color: #2e7d32;
        }

        /* Variación de Error */
        .alerta-error {
            border-left: 6px solid #ef5350;
        }

        .alerta-error .alerta-titulo {
            color: #c62828;
        }
    </style>
</head>

<body>

    <h2>Simulador de Respuestas del Sistema</h2>

    <!-- Botones de prueba que simulan las acciones del backend -->
    <div class="panel-botones">
        <button class="btn-exito" onclick="simularPedidoExitoso()">Simular Pedido Exitoso (HU-04)</button>
        <button class="btn-error" onclick="simularErrorLogin()">Simular Error de Login (HU-00)</button>
    </div>

    <!-- Contenedor único donde JavaScript inyectará las alertas dinámicamente -->
    <div id="contenedor-notificaciones"></div>


    <!-- ==========================================
       CÓDIGO DE JAVASCRIPT COMPLETO
       ========================================== */ -->
    <script>
        /**
         * Función principal y reutilizable para crear y mostrar alertas.
         * @param {string} tipo - Puede ser 'exito' o 'error'.
         * @param {string} titulo - Encabezado en negrita de la alerta.
         * @param {string} mensaje - El texto descriptivo de la alerta.
         */
        function lanzarNotificacion(tipo, titulo, mensaje) {
            // 1. Ubicar el contenedor flotante en la pantalla
            const contenedor = document.getElementById('contenedor-notificaciones');

            // 2. Crear la estructura HTML del elemento desde cero usando código
            const nuevaAlerta = document.createElement('div');

            // Aplicar las clases CSS necesarias (ej: "alerta alerta-exito")
            nuevaAlerta.className = `alerta alerta-${tipo}`;

            // Atributo técnico para lectores de pantalla de personas con discapacidad visual
            nuevaAlerta.setAttribute('role', 'alert');

            // 3. Asignar el emoji correspondiente según el tipo de respuesta
            const icono = tipo === 'exito' ? '✅' : '❌';

            // 4. Insertar el esqueleto del contenido dentro de la tarjeta
            nuevaAlerta.innerHTML = `
        <span class="alerta-icono">${icono}</span>
        <div class="alerta-contenido">
          <div class="alerta-titulo">${titulo}</div>
          <div class="alerta-mensaje">${mensaje}</div>
        </div>
      `;

            // 5. Agregar la tarjeta físicamente dentro del contenedor flotante
            contenedor.appendChild(nuevaAlerta);

            // 6. ANIMACIÓN DE ENTRADA: Esperamos un milisegundo para que el navegador note el cambio
            // y le añadimos la clase .mostrar para que viaje suavemente desde la derecha
            setTimeout(() => {
                nuevaAlerta.classList.add('mostrar');
            }, 50);

            // 7. ANIMACIÓN DE SALIDA AUTOMÁTICA: Tras 4.5 segundos, iniciamos la retirada
            setTimeout(() => {
                // Le quitamos la clase .mostrar (se vuelve invisible y se mueve al costado)
                nuevaAlerta.classList.remove('mostrar');

                // Esperamos 400 milisegundos (lo que dura la transición CSS) para borrarlo del código
                setTimeout(() => {
                    nuevaAlerta.remove();
                }, 400);

            }, 4500);
        }


        /* ==========================================
           FUNCIONES INVOCADAS POR NUESTROS BOTONES
           ========================================== */

        // Simula la HU-04: Confirmación de pedido exitoso
        function simularPedidoExitoso() {
            // Generamos un número aleatorio para simular el identificador único de la base de datos
            const randomId = Math.floor(1000 + Math.random() * 9000);

            lanzarNotificacion(
                'exito',
                '¡Pedido confirmado!',
                `Tu orden ha sido registrada con la referencia #CAF-${randomId}. Ya la estamos preparando en cocina.`
            );
        }

        // Simula la HU-00: Credenciales incorrectas al iniciar sesión
        function simularErrorLogin() {
            lanzarNotificacion(
                'error',
                'Error de autenticación',
                'El correo electrónico o la contraseña ingresados no coinciden con nuestros registros. Inténtalo de nuevo.'
            );
        }
    </script>
</body>

</html>
