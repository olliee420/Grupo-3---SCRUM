<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Sistema Cafetería</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 350px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-login { width: 100%; padding: 10px; background-color: #003366; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .btn-login:hover { background-color: #002244; }
        .error-message { color: red; font-size: 14px; display: none; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

<div class="login-container">
    <h2 style="text-align: center; color: #003366;">Iniciar Sesión</h2>
    <form id="formAuth" novalidate>
        <div class="form-group">
            <label for="correo">Correo Electrónico *</label>
            <input type="email" id="correo" required placeholder="ejemplo@universidad.edu">
        </div>
        <div class="form-group">
            <label for="contrasenia">Contraseña *</label>
            <input type="password" id="contrasenia" required placeholder="Ingresa tu contraseña">
        </div>
        <button type="submit" class="btn-login">Ingresar</button>
        <div id="mensajeError" class="error-message">Correo o contraseña incorrectos.</div>
    </form>
</div>

<script src="auth.js"></script>
</body>
</html>
